name: Build Complete PKC Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        echo "安装 Theos 工具链..."
        sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
        echo "/opt/theos" >> $GITHUB_PATH
        echo "THEOS=/opt/theos" >> $GITHUB_ENV

    - name: Setup SDK
      run: |
        # 尝试使用 Xcode 自带的 iPhoneOS SDK
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
        echo "SDK_PATH: $SDK_PATH"
        if [ -n "$SDK_PATH" ]; then
          sudo mkdir -p /opt/theos/sdks
          sudo ln -sf "$SDK_PATH" /opt/theos/sdks/iPhoneOS.sdk
        fi

    - name: Build PKC60sFix
      run: |
        export THEOS=/opt/theos
        make clean || true
        make package FINALPACKAGE=1
        echo "=== 编译结果 ==="
        find . -name "*.dylib" -o -name "*.deb" | head -20
        ls -la packages/ || true
        ls -la *.deb || true

    - name: Extract original deb
      run: |
        echo "=== 解压原始 PKC deb ==="
        mkdir -p deb_work
        cd deb_work
        ar x ../original/PKCWeChatTools.deb
        echo "=== 解压 data.tar ==="
        mkdir -p extracted
        cd extracted
        tar xf ../data.tar.xz || tar xf ../data.tar
        echo "=== 原始 deb 内容 ==="
        find . -type f | head -20

    - name: Merge fix dylib into deb
      run: |
        echo "=== 合并补丁到 deb ==="
        DYLIB_PATH=$(find . -name "PKC60sFix.dylib" -path "*/packages/*" | head -1)
        if [ -z "$DYLIB_PATH" ]; then
          DYLIB_PATH=$(find . -name "PKC60sFix.dylib" | head -1)
        fi
        echo "补丁 dylib: $DYLIB_PATH"
        
        if [ -z "$DYLIB_PATH" ]; then
          echo "ERROR: PKC60sFix.dylib 未找到！"
          exit 1
        fi
        
        # 复制补丁 dylib 和 plist 到 deb 的 DynamicLibraries 目录
        DEB_LIB_DIR="deb_work/extracted/var/jb/Library/MobileSubstrate/DynamicLibraries"
        cp "$DYLIB_PATH" "$DEB_LIB_DIR/PKC60sFix.dylib"
        cp PKC60sFix.plist "$DEB_LIB_DIR/PKC60sFix.plist"
        
        echo "=== 合并后的 DynamicLibraries 目录 ==="
        ls -la "$DEB_LIB_DIR"

    - name: Repackage deb
      run: |
        echo "=== 重新打包 deb ==="
        cd deb_work/extracted
        # 重新创建 data.tar
        tar cf ../data.tar .
        # 如果有 xz，用 xz 压缩
        if command -v xz &>/dev/null; then
          xz -f ../data.tar
        fi
        cd ..
        
        # 重新创建 deb 包
        rm -f ../PKC_0.9-9-Beta1-Fixed.deb
        ar rcs ../PKC_0.9-9-Beta1-Fixed.deb debian-binary control.tar.* data.tar.*
        cd ..
        
        echo "=== 最终 deb 文件 ==="
        ls -la PKC_0.9-9-Beta1-Fixed.deb
        echo "大小: $(du -h PKC_0.9-9-Beta1-Fixed.deb | cut -f1)"

    - name: Upload deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: PKC-Complete-Fixed
        path: PKC_0.9-9-Beta1-Fixed.deb
        if-no-files-found: error

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.1-fixed
        name: PKC 0.9-9 Beta1 Fixed
        body: |
          ## PKC 完整修复版
          
          修复内容：
          1. 60秒新闻只发标题/空白/乱码 → 多API源自动回退+正确JSON解析
          2. 微信8.0.78/79消息发送方式变化导致发送失败/闪退 → 为WeixinContentLogicController添加AddMsg:MsgWrap:转发到CMessageMgr
          
          使用方法：
          - 直接注入此 deb 到微信 IPA（无需原始 PKC deb）
          - 包含原始 PKC 所有功能 + 60秒新闻修复
        files: PKC_0.9-9-Beta1-Fixed.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
