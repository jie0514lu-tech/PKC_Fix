name: Build Complete PKC Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
        brew install ldid dpkg

    - name: Setup SDK
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        sudo mkdir -p /opt/theos/sdks
        sudo ln -sf "$SDK_PATH" /opt/theos/sdks/iPhoneOS.sdk

    - name: Build PKC60sFix dylib
      run: |
        export THEOS=/opt/theos
        make clean 2>&1
        make FINALPACKAGE=1 2>&1
        echo "=== 查找 dylib ==="
        DYLIB=$(find .theos -name "PKC60sFix.dylib" -type f | head -1)
        echo "DYLIB=$DYLIB"
        if [ -z "$DYLIB" ]; then
          echo "ERROR: dylib not found!"
          find . -name "*.dylib" -type f 2>/dev/null
          exit 1
        fi
        echo "dylib size: $(du -h "$DYLIB" | cut -f1)"
        ldid -S "$DYLIB"
        echo "已签名 PKC60sFix"

        # 准备 libsubstrate.dylib（原始 PKC 依赖它）
        # 从 Theos 的 CydiaSubstrate.framework 复制并命名为 libsubstrate.dylib
        CS_PATH=$(find /opt/theos -name "CydiaSubstrate" -type f 2>/dev/null | head -1)
        echo "CydiaSubstrate path: $CS_PATH"
        if [ -n "$CS_PATH" ]; then
          cp "$CS_PATH" .theos/libsubstrate.dylib
          # 更改 install name 为 @rpath/libsubstrate.dylib
          install_name_tool -id "@rpath/libsubstrate.dylib" .theos/libsubstrate.dylib 2>/dev/null || true
          ldid -S .theos/libsubstrate.dylib
          echo "已创建 libsubstrate.dylib"
          ls -la .theos/libsubstrate.dylib
        else
          echo "WARNING: CydiaSubstrate not found, libsubstrate.dylib 未创建"
        fi

    - name: Extract original deb and merge
      run: |
        echo "=== 原始 deb 大小 ==="
        ls -la original/PKCWeChatTools.deb
        
        # 创建工作目录
        rm -rf deb_build
        mkdir -p deb_build
        
        # 解压原始 deb
        cd deb_build
        ar x ../original/PKCWeChatTools.deb
        echo "=== ar 解压内容 ==="
        ls -la
        
        # 解压 control.tar
        mkdir -p control_extract
        cd control_extract
        if [ -f ../control.tar.xz ]; then
          tar xf ../control.tar.xz
        elif [ -f ../control.tar.gz ]; then
          tar xzf ../control.tar.gz
        else
          tar xf ../control.tar
        fi
        echo "=== control 内容 ==="
        cat ./control 2>/dev/null || find . -type f
        cd ..
        
        # 解压 data.tar
        mkdir -p data_extract
        cd data_extract
        if [ -f ../data.tar.xz ]; then
          tar xf ../data.tar.xz
        elif [ -f ../data.tar.gz ]; then
          tar xzf ../data.tar.gz
        else
          tar xf ../data.tar
        fi
        echo "=== data 内容 ==="
        find . -type f
        cd ..
        
        # 构建 dpkg-deb 目录结构
        mkdir -p pkg/DEBIAN
        cp control_extract/control pkg/DEBIAN/control
        # 复制 data 内容（保留 var/jb/... 结构）
        cp -R data_extract/* pkg/ 2>/dev/null || true

        LIB_DIR="pkg/var/jb/Library/MobileSubstrate/DynamicLibraries"

        # 修复原始 PKC dylib 的依赖：libsubstrate.dylib → CydiaSubstrate.framework/CydiaSubstrate
        # 签名工具只注入有 plist 的 dylib，libsubstrate.dylib 没有 plist 不会被注入
        # 所以直接修改 PKCWeChatTools.dylib 的依赖指向已存在的 CydiaSubstrate
        PKC_DYLIB="$LIB_DIR/PKCWeChatTools.dylib"
        if [ -f "$PKC_DYLIB" ]; then
          echo "=== 修复前 PKCWeChatTools.dylib 依赖 ==="
          otool -L "$PKC_DYLIB" 2>/dev/null | grep -i substrate
          # 替换依赖路径
          install_name_tool -change "@rpath/libsubstrate.dylib" "@rpath/CydiaSubstrate.framework/CydiaSubstrate" "$PKC_DYLIB" 2>/dev/null
          # 也尝试其他可能的路径写法
          install_name_tool -change "/Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate" "@rpath/CydiaSubstrate.framework/CydiaSubstrate" "$PKC_DYLIB" 2>/dev/null
          install_name_tool -change "/usr/lib/libsubstrate.dylib" "@rpath/CydiaSubstrate.framework/CydiaSubstrate" "$PKC_DYLIB" 2>/dev/null
          echo "=== 修复后 PKCWeChatTools.dylib 依赖 ==="
          otool -L "$PKC_DYLIB" 2>/dev/null | grep -i substrate
          # 重新签名
          ldid -S "$PKC_DYLIB"
          echo "已修复 PKCWeChatTools.dylib 依赖并重新签名"
        else
          echo "ERROR: PKCWeChatTools.dylib not found at $PKC_DYLIB"
        fi

        # 复制补丁 dylib 和 plist
        DYLIB=$(find ../.theos -name "PKC60sFix.dylib" -type f | head -1)
        echo "补丁 dylib: $DYLIB"
        cp "$DYLIB" "$LIB_DIR/PKC60sFix.dylib"
        cp ../PKC60sFix.plist "$LIB_DIR/PKC60sFix.plist"

        # 同时修复 PKC60sFix.dylib 的 substrate 依赖
        if [ -f "$LIB_DIR/PKC60sFix.dylib" ]; then
          install_name_tool -change "@rpath/libsubstrate.dylib" "@rpath/CydiaSubstrate.framework/CydiaSubstrate" "$LIB_DIR/PKC60sFix.dylib" 2>/dev/null
          ldid -S "$LIB_DIR/PKC60sFix.dylib"
        fi

        echo "=== 合并后 pkg 内容 ==="
        find pkg -type f -exec ls -la {} \;
        
        # 用 dpkg-deb 打包
        cd ..
        dpkg-deb -Zxz -b deb_build/pkg PKC_0.9-9-Beta1-Fixed.deb
        
        echo "=== 最终 deb ==="
        ls -la PKC_0.9-9-Beta1-Fixed.deb
        echo "大小: $(du -h PKC_0.9-9-Beta1-Fixed.deb | cut -f1)"

    - name: Verify deb
      run: |
        echo "=== 验证 deb 内容 ==="
        dpkg-deb -c PKC_0.9-9-Beta1-Fixed.deb
        echo "=== deb 包信息 ==="
        dpkg-deb -I PKC_0.9-9-Beta1-Fixed.deb

    - name: Upload deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: PKC-Complete-Fixed
        path: PKC_0.9-9-Beta1-Fixed.deb
        if-no-files-found: error

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v4.1-fixed
        name: PKC 0.9-9 Beta1 Fixed
        body: |
          ## PKC 完整修复版 v4.1
          1. 精简目标查找：删除慢速的NSUserDefaults全盘扫描和plist扫描
          2. 新增UIViewController viewWillDisappear hook：捕捉用户选择群聊/好友时的目标
          3. 选择器页面消失后0.5秒扫描PKC单例，获取用户选中的wxid
          4. 保留快速查找：PKC单例递归扫描 + 当前聊天VC扫描
          5. 代码更简洁，不卡顿不闪退

          直接注入此 deb 到微信 IPA，包含原始 PKC 所有功能 + 60秒新闻修复
        files: PKC_0.9-9-Beta1-Fixed.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
