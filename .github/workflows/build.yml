name: Build Complete PKC Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
        brew install ldid dpkg

    - name: Setup SDK
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        sudo mkdir -p /opt/theos/sdks
        sudo ln -sf "$SDK_PATH" /opt/theos/sdks/iPhoneOS.sdk

    - name: Build PKC60sFix dylib
      run: |
        export THEOS=/opt/theos
        make clean 2>&1
        make FINALPACKAGE=1 2>&1
        echo "=== 编译产物 ==="
        find .theos -name "*.dylib" 2>/dev/null
        # 查找最终的 dylib（通常在 .theos/obj/ 下）
        DYLIB=$(find .theos -name "PKC60sFix.dylib" | head -1)
        echo "DYLIB=$DYLIB"
        if [ -n "$DYLIB" ]; then
          # 用 ldid 签名
          ldid -S "$DYLIB"
          echo "已签名"
        fi

    - name: Find dylib
      run: |
        find . -name "PKC60sFix.dylib" 2>/dev/null

    - name: Extract original deb
      run: |
        mkdir -p deb_work/extracted
        cd deb_work
        ar x ../original/PKCWeChatTools.deb
        cd extracted
        if [ -f ../data.tar.xz ]; then tar xf ../data.tar.xz; else tar xf ../data.tar; fi
        find . -type f

    - name: Merge and Repackage
      run: |
        # 查找编译好的 dylib（在 .theos/obj/ 目录下）
        DYLIB=$(find .theos -name "PKC60sFix.dylib" | head -1)
        echo "补丁 dylib: $DYLIB"
        if [ -z "$DYLIB" ]; then echo "dylib not found"; exit 1; fi
        LIB_DIR="deb_work/extracted/var/jb/Library/MobileSubstrate/DynamicLibraries"
        cp "$DYLIB" "$LIB_DIR/PKC60sFix.dylib"
        cp PKC60sFix.plist "$LIB_DIR/PKC60sFix.plist"
        echo "=== 合并后的 DynamicLibraries ==="
        ls -la "$LIB_DIR"
        # 重新打包 data.tar
        cd deb_work/extracted
        tar cf ../data.tar .
        xz -f -9 ../data.tar
        cd ../..
        # 重新创建 deb
        ar rcs PKC_0.9-9-Beta1-Fixed.deb deb_work/debian-binary deb_work/control.tar.* deb_work/data.tar.*
        echo "=== 最终 deb ==="
        ls -la PKC_0.9-9-Beta1-Fixed.deb

    - name: Upload deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: PKC-Complete-Fixed
        path: PKC_0.9-9-Beta1-Fixed.deb
        if-no-files-found: warn

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.1-fixed
        name: PKC 0.9-9 Beta1 Fixed
        body: |
          ## PKC 完整修复版
          1. 60秒新闻只发标题/空白/乱码 → 多API源自动回退+正确JSON解析
          2. 微信8.0.78/79消息发送方式变化 → 为WeixinContentLogicController添加AddMsg:MsgWrap:转发到CMessageMgr
          
          直接注入此 deb 到微信 IPA，包含原始 PKC 所有功能 + 60秒新闻修复
        files: PKC_0.9-9-Beta1-Fixed.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
